version: '3.8'

services:

  #rabbitmq_orchestrator
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - pharmacy-network

  #postgres_orchestrator
  postgres_orchestrator:
    image: postgres:13
    container_name: postgres_orchestrator
    environment:
      POSTGRES_DB: orchestrator_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "8432:5432"
    volumes:
      - postgres-orchestrator-data:/var/lib/postgresql/data
    networks:
      - pharmacy-network

  #orchestrator
  orchestrator:
    build:
      context: .
      dockerfile: Orchestrator/Dockerfile
    container_name: orchestrator
    depends_on:
      - rabbitmq
      - postgres_orchestrator
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OrchestratorDatabase=Host=postgres_orchestrator;Port=5432;Database=orchestrator_db;Username=postgres;Password=postgres
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - DOTNET_SYSTEM_METRICS_ENABLED=true  # Включаем системные метрики .NET
      - DOTNET_DIAGNOSTICS_METRICS_ENABLED=true
    volumes:
      - ~/.vsdbg:/remote_debugger:rw
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    ports:
      - "5000:80"
    networks:
      - pharmacy-network
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    labels:
      - "prometheus.enable=true"
      - "prometheus.port=80"
      - "prometheus.path=/metrics"
      - "prometheus.job=orchestrator"
      - "prometheus.scrape=true"
      - "prometheus.metrics=.net"  # Указываем тип метрик

  #data-harvester-tabletka-by
  data-harvester-tabletka-by:
    build:
      context: .
      dockerfile: DataHarvesterTabletkaBy/Dockerfile
    container_name: data-harvester-tabletka-by
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - DOTNET_SYSTEM_METRICS_ENABLED=true  # Включаем системные метрики .NET
      - DOTNET_DIAGNOSTICS_METRICS_ENABLED=true
    ports:
      - "6001:80"
    networks:
      - pharmacy-network
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    labels:
      - "prometheus.enable=true"
      - "prometheus.port=80"
      - "prometheus.path=/metrics"
      - "prometheus.job=data-harvester"
      - "prometheus.instance=tabletka-by"
      - "prometheus.metrics=.net"  # Указываем тип метрик

  #data-harvester-apteka-103-by
  data-harvester-apteka-103-by:
    build: 
      context: .
      dockerfile: DataHarvesterApteka103By/Dockerfile
    container_name: data-harvester-apteka-103-by
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - DOTNET_SYSTEM_METRICS_ENABLED=true  # Включаем системные метрики .NET
      - DOTNET_DIAGNOSTICS_METRICS_ENABLED=true
    ports:
      - "5001:80"
    networks:
      - pharmacy-network
    restart: unless-stopped
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    labels:
      - "prometheus.enable=true"
      - "prometheus.port=80"
      - "prometheus.path=/metrics"
      - "prometheus.job=data-harvester"
      - "prometheus.instance=apteka-103-by"
      - "prometheus.metrics=.net"  # Указываем тип метрик

  #postgres_aggregator
  postgres_aggregator:
    image: postgres:13
    container_name: postgres_aggregator
    environment:
     POSTGRES_DB: aggregator_db
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: postgres
     POSTGRES_HOST_AUTH_METHOD: trust
    ports:
        - "7432:5432"
    volumes:
        - postgres-aggregator-data:/var/lib/postgresql/data
    networks:
        - pharmacy-network

  #redis_aggregator
  redis_aggregator:
    image: redis:7-alpine
    container_name: redis_aggregator
    ports:
        - "7379:6379"
    volumes:
        - redis-aggregator-data:/data
    networks:
        - pharmacy-network
    command: redis-server --appendonly yes

  #aggregator
  aggregator:
    build:
      context: .
      dockerfile: DataAggregator/Dockerfile
    container_name: aggregator
    depends_on:
      - postgres_aggregator
      - redis_aggregator
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DataAggregatorDatabase=Host=postgres_aggregator;Port=5432;Database=aggregator_db;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis_aggregator:6379
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=guest
      - RabbitMQ__Password=guest
      - DOTNET_SYSTEM_METRICS_ENABLED=true  # Включаем системные метрики .NET
      - DOTNET_DIAGNOSTICS_METRICS_ENABLED=true
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    ports:
      - "7000:80"
    networks:
      - pharmacy-network
    restart: unless-stopped
    cap_add:
     - SYS_PTRACE
    security_opt:
     - seccomp:unconfined
    labels:
      - "prometheus.enable=true"
      - "prometheus.port=80"
      - "prometheus.path=/metrics"
      - "prometheus.job=aggregator"
      - "prometheus.scrape=true"
      - "prometheus.metrics=.net"  # Указываем тип метрик

# Экспортер для Postgres orchestrator
  postgres-exporter-orchestrator:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-orchestrator
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres_orchestrator:5432/orchestrator_db?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - pharmacy-network
    depends_on:
      - postgres_orchestrator
    labels:
      - "prometheus.enable=true"
      - "prometheus.port=9187"
      - "prometheus.path=/metrics"
      - "prometheus.job=postgres-exporter"
      - "prometheus.instance=orchestrator"

# Экспортер для Postgres aggregator
  postgres-exporter-aggregator:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter-aggregator
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres_aggregator:5432/aggregator_db?sslmode=disable"
    ports:
      - "9188:9188"
    networks:
      - pharmacy-network
    depends_on:
      - postgres_aggregator
    labels:
      - "prometheus.enable=true"
      - "prometheus.port=9188"
      - "prometheus.path=/metrics"
      - "prometheus.job=postgres-exporter"
      - "prometheus.instance=aggregator"

 # Экспортер для Redis
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      REDIS_ADDR: "redis_aggregator:6379"
    ports:
      - "9121:9121"
    networks:
      - pharmacy-network
    depends_on:
      - redis_aggregator

 # Экспортер для RabbitMQ
  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    container_name: rabbitmq-exporter
    environment:
      - RABBIT_URL=http://rabbitmq:15672
      - RABBIT_USER=guest
      - RABBIT_PASSWORD=guest
      - PUBLISH_PORT=9419
    ports:
      - "9419:9419"
    networks:
      - pharmacy-network
    depends_on:
      - rabbitmq

volumes:
  postgres-aggregator-data:
  postgres-orchestrator-data:
  redis-aggregator-data:
  rabbitmq-data:

networks:
  pharmacy-network:
    name: pharmacy-network
    driver: bridge